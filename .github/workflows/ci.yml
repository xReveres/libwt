name: Linux build and interoperability
on: [push, pull_request]
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Dependencies
        run: |
          python -m pip install aioquic==1.3.0 cryptography==46.0.5
          python -m pip install -r requirements-format.txt
          sudo apt-get update
          sudo apt-get install -y clang-format-20
          npm ci
      - name: Format check
        run: npm run format:check
      - name: Configure native
        run: cmake --preset default
      - name: Build native
        run: cmake --build --preset default -j4
      - name: CTest protocol and lifecycle
        run: ctest --preset default
      - name: Native interoperability
        run: python3 tests/InteropTest.py
      - name: Session statistics and admission
        run: python3 tests/SessionStatisticsTest.py
      - name: HTTP/3 protocol boundaries
        run: python3 tests/ProtocolRuntimeTest.py
      - name: Configure Node
        run: cmake --preset node
      - name: Build Node
        run: cmake --build --preset node -j4
      - name: Node lifecycle and configuration
        run: node --test bindings/node/test.js
      - name: Node interoperability
        run: python3 tests/InteropTest.py --server 'node examples/node-echo.js'
      - name: Node session events
        run: python3 tests/NodeSessionTest.py
      - name: Node bridge overflow
        run: python3 tests/NodeOverflowTest.py
      - name: Node lifecycle overflow
        run: python3 tests/NodeLifecycleOverflowTest.py
      - name: Installed consumer
        run: |
          cmake --install build --prefix "$PWD/build/install"
          cmake -S tests/consumer-installed -B build/consumer-installed -DCMAKE_PREFIX_PATH="$PWD/build/install"
          cmake --build build/consumer-installed
          build/consumer-installed/consumer
      - name: Relocated consumer
        run: |
          cmake -E copy_directory build/install build/relocated
          cmake -S tests/consumer-installed -B build/consumer-relocated -DCMAKE_PREFIX_PATH="$PWD/build/relocated"
          cmake --build build/consumer-relocated
          build/consumer-relocated/consumer
      - name: Subdirectory consumer
        run: |
          cmake -S tests/consumer-subdirectory -B build/consumer-subdirectory \
            -DLIBWT_USE_SYSTEM_MSQUIC=ON \
            -DLIBWT_MSQUIC_INCLUDE_DIR="$PWD/build/install/include" \
            -DLIBWT_MSQUIC_LIBRARY="$PWD/build/install/lib/libmsquic.so"
          cmake --build build/consumer-subdirectory
          build/consumer-subdirectory/consumer
